[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwi-ref-python"
version = "1.0.0"
description = "Kiwi Negotiation Protocol (KNP) — 最小独立参考实现（零 kiwi 依赖，纯标准库）"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
keywords = ["a2a", "knp", "negotiation", "agent-commerce"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
kiwi-ref = "kiwi_ref.run:main"

[tool.setuptools]
packages = ["kiwi_ref"]
