[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-mcp"
version = "0.2.1"
description = "Local-first personal health management with evidence-linked records and scoped MCP tools"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "cryptography>=42",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
mcp-legacy = ["mcp>=1.26,<2"]
advisor = ["mcp>=1.26,<2"]
mcp-v2 = ["mcp==2.0.0"]

[dependency-groups]
dev = ["pytest"]

# mcp-legacy/advisor (mcp 1.x) and mcp-v2 (mcp 2.0.0) are mutually exclusive
# environment choices; uv needs this declared to lock all extras at once.
[tool.uv]
conflicts = [
  [
    { extra = "mcp-legacy" },
    { extra = "mcp-v2" },
  ],
  [
    { extra = "advisor" },
    { extra = "mcp-v2" },
  ],
]

[project.scripts]
healthcare = "healthcare.cli:main"
healthcare-mcp = "healthcare.mcp_server:main"
healthcare-mcp-v2 = "healthcare.mcp_v2_entrypoint:main"
healthcare-workbuddy = "healthcare.workbuddy_entrypoint:main"
healthcare-hermes = "healthcare.hermes_entrypoint:main"
health-advisor = "healthcare.advisor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
healthcare = ["schema_data/*.json", "advisor/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
