# DeepSeek Harness（dsh）Kiwi MCP 插件配置（可复用）
#
# 把以下 insert 追加到 ~/.dsh/profiles/web/cordis.patch.yml（先备份现有内容），
# 替换 <KIWI_ROOT> 为本地 kiwi 仓库路径，然后 `dsh web` 重启。
# 工具以 mcp__kiwi__<name> 暴露（如 mcp__kiwi__kiwi_search），共 9 个。
- insert:
    - id: mcp-kiwi
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: kiwi
        transport: stdio
        command: node
        args:
          - <KIWI_ROOT>/dist/cli.js
          - mcp
          - serve
          - --db
          - <KIWI_ROOT>/.kiwi/mcp/dsh.sqlite
          - --principal
          - dsh:<user>
          - --agent
          - buyer-agent:dsh
          # Clash fake-IP 代理环境必须：代理把域名解析成 198.18.0.0/15
          # （benchmarking 保留网段），A2A 客户端 DNS 复查默认拒绝。
          # 跳过 DNS 复查（信任 catalog 发布的商家域名；与 Hermes 同配置）。
          # 非代理环境可去掉。
          - --a2a-skip-dns-check
          - "true"
        cwd: <KIWI_ROOT>
        toolCallTimeoutMs: 60000
        failOnStartupError: false
