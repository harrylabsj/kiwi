# Hermes MCP 配置（追加到 ~/.hermes/config.yaml 的 mcp_servers 下）
#
# kiwi-buyer-mcp：Hermes 自动发现 Kiwi 工具。默认 13 个（询报价、确认审批、
# 交接和商家关注）；下方可选开关另加商家回执查询。
# 持久 store 在 <KIWI_ROOT>/.kiwi/mcp/state.sqlite；principal 建议按 Hermes 用户区分。
# 每个 Hermes 客户端实例必须由宿主提供稳定的 KIWI_CLIENT_ID（并持久化），
# 作为任务归属；不要把 PID 或共享默认值当客户端身份。
#
# 两种执行 seam（build-service.ts 按 URL 选择）：
#   A) A2A 直连（推荐）：--catalog-url → catalog 发现 + A2A 直连 merchant 磋商。
#      buyer 只连 catalog 获取信息，然后直接与 kiwi merchant 沟通（merchant 自己调
#      shopping-cli）。本地试点 daemon 不需要跑。
#   B) marketplace 直连（试点兼容）：--marketplace-url → shopping-cli 直连。
#
# 复制到 ~/.hermes/config.yaml:

# A) A2A 直连（本地 hermes + 远程/本地 catalog + merchant）
# mcp_servers:
#   kiwi-buyer-mcp:
#     command: "node"
#     cwd: "/Users/<user>/coding/kiwi"     # 必需：mcp serve 对 cwd 敏感
#     args:
#       - "/Users/<user>/coding/kiwi/dist/cli.js"
#       - "mcp"
#       - "serve"
#       - "--db"
#       - "/Users/<user>/coding/kiwi/.kiwi/mcp/hermes.sqlite"
#       - "--principal"
#       - "hermes:<user>"
#       - "--agent"
#       - "buyer-agent:hermes"
#       # --catalog-url 可省略：默认 https://catalog.kiwi.harrylabsj.com（覆盖才需要传）
#       # - "--catalog-url"
#       # - "https://catalog.kiwi.harrylabsj.com"
#       # A2A 可选：--a2a-bearer-token <token>
#       #         --a2a-allow-private-ranges true（本地/私网 merchant 直连）
#       #         --a2a-skip-dns-check true（Clash fake-IP 等代理环境需跳过 DNS 复查）
#       #         --a2a-timeout-ms 20000
#       # 可选：允许买家主动查商家待确认回执。仍需原 A2A 签名身份；沿用原会话
#       # 已配置的签名方式与密钥目录，不要为查旧回执临时更换身份。
#     env:
#       KIWI_CLIENT_ID: "hermes:<stable-client-id>"
#       KIWI_MCP_MERCHANT_FOLLOWUPS: "1"
#
# 先对 Kiwi 任务使用 kiwi_negotiate(action=clarification) 提问。若
# step.merchant_extensions.product_answers 中有 followup.case_ref，只有在买家
# 主动询问进展时，才把原 task_id、merchant_extensions.candidate_id 和这个
# case_ref 交给 kiwi_get_merchant_followup。不要把待办当成已答，也不要定时轮询。
# merchant_extensions.next_step 若有 new_rfq，只展示建议；须经买家确认后才
# 另发 kiwi_request_quotes，不更改现有数量、报价或接受动作。

# B) marketplace 直连（试点兼容；需本地/隧道可达 shopping-cli）
# mcp_servers:
#   kiwi-buyer-mcp:
#     command: "node"
#     cwd: "/Users/<user>/coding/kiwi"
#     args:
#       - "/Users/<user>/coding/kiwi/dist/cli.js"
#       - "mcp"
#       - "serve"
#       - "--db"
#       - "/Users/<user>/coding/kiwi/.kiwi/mcp/hermes.sqlite"
#       - "--principal"
#       - "hermes:<user>"
#       - "--agent"
#       - "buyer-agent:hermes"
#       - "--marketplace-url"
#       - "http://127.0.0.1:8765"
#       - "--buyer-bootstrap-token"
#       - "<SHOPPING_BUYER_BOOTSTRAP_TOKEN>"

# 安全默认（未给 --policy）：discover/inquiry_rfq/compare/counter_offer=AUTO，
# accept_nonbinding/handoff=ASK，payment=NEVER。硬约束与更多策略见
# contracts/delegation-policy/1.0/schema.json。
