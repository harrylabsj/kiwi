# Merchant profile — deterministic fake model against a local shopping-cli.
# Runs the full single-turn slice with zero model dependency.
# Requires: SHOPPING_AGENT_TOKEN set (agent token for merchant-001).
runtime_version: 0.6.0
protocol_version: shopping.negotiation/0.1
agent_id: merchant-agent:merchant-001
role: merchant
owner_id: merchant-001
commerce:
  base_url: http://127.0.0.1:8765
  token_env: SHOPPING_AGENT_TOKEN
  backend: local_marketplace
  allow_demo_price_fallback: true
model:
  provider: fake
  model: fake-merchant-model
# 离线冒烟：merchant 定价确定性（[floor, list] 内响应），促销可配置见
# merchant_policy.promos。
runtime:
  mode: once
  poll_interval_seconds: 5
  turn_timeout_seconds: 90
  max_model_steps: 4
  max_retries: 2
merchant_policy:
  min_unit_price_private: 80.00
  max_auto_discount_percent: 10
  inventory_source: marketplace
  quote_ttl_seconds: 300
  auto_negotiate: true
  human_review_on:
    - below_floor
    - exceptional_warranty
    - suspicious_content
merchant_experience:
  enabled: true
  intelligence: true
  grounding: true
  presentation: true
  skills: true
