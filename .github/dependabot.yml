version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # 审查 P3：actions 生态此前未覆盖——workflow 全 SHA 固定下无自动更新
  # 提醒；每周检查，限制并发避免依赖升级风暴
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # codeql-action 的 init/autobuild/analyze 必须是同一版本（各自单独升级
    # 会让 CodeQL 报 "Loaded a configuration file for version X, but running
    # version Y"）。分组后 Dependabot 只开一个协同升级 PR。
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
