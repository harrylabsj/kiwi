# npm OIDC trusted publishing (@harrylabsj/kiwi) — 无 NODE_AUTH_TOKEN。
#
# 前置条件：
# - npmjs.com 包设置：Settings → Publishing access → GitHub Actions
#   （owner/repo = harrylabsj/kiwi，workflow = npm-publish.yml）
# - npm >= 11.5.1（runner 自带 npm 10.x，下方显式升级）
# - package.json repository.url 与本仓库一致
#   （git+https://github.com/harrylabsj/kiwi.git）
# 关键：不要设置 NODE_AUTH_TOKEN 环境变量——会覆盖 OIDC 检测。
name: npm-publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # npm OIDC 签名（provenance）

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest   # OIDC trusted publishing 需要 npm >= 11.5.1
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
