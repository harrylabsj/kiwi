name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支/PR 的新推送取消旧运行，避免 PR 分支全量双跑（审查 P3）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Supervisor tests exercise the managed local gateway against the public
      # shopping-cli consumer. Resolve only the allowlisted, full-SHA lock entry
      # so ordinary Kiwi CI remains reproducible without a private token.
      - id: portfolio_lock
        name: Read locked shopping-cli source
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('portfolio.lock.json', 'utf8'));
          const entry = lock.repositories?.['shopping-cli'];
          if (!entry || entry.repository !== 'harrylabsj/shopping-cli') {
            throw new Error('portfolio lock must allowlist harrylabsj/shopping-cli');
          }
          if (!/^[0-9a-f]{40}$/.test(entry.commit)) {
            throw new Error(`shopping-cli commit is not a full 40-char SHA: ${entry.commit}`);
          }
          console.log(`shopping_cli_sha=${entry.commit}`);
          NODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: harrylabsj/shopping-cli
          ref: ${{ steps.portfolio_lock.outputs.shopping_cli_sha }}
          path: shopping-cli
          persist-credentials: false
      # 三方联调（tests/three-party-open-inquiry.e2e.test.ts）需要工作区内的
      # kiwi-catalog sibling 与固定版本 uv：检出同 lock 的目录 SHA，并在
      # `npm run test` 之前装好 uv（仓库惯例 uv==0.10.6，见其它 workflow）。
      - id: catalog_lock
        name: Read locked kiwi-catalog source
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('portfolio.lock.json', 'utf8'));
          const entry = lock.repositories?.['kiwi-catalog'];
          if (!entry || entry.repository !== 'harrylabsj/kiwi-catalog') {
            throw new Error('portfolio lock must allowlist harrylabsj/kiwi-catalog');
          }
          if (!/^[0-9a-f]{40}$/.test(entry.commit)) {
            throw new Error(`kiwi-catalog commit is not a full 40-char SHA: ${entry.commit}`);
          }
          console.log(`kiwi_catalog_sha=${entry.commit}`);
          NODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: harrylabsj/kiwi-catalog
          ref: ${{ steps.catalog_lock.outputs.kiwi_catalog_sha }}
          path: kiwi-catalog
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install locked uv for the cross-process E2E
        run: |
          python -m pip install "uv==0.10.6"
          uv --version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.3"
          cache: npm
      - name: Setup npm 12 and verify the install toolchain
        run: |
          npm install --global npm@12.2.0
          node scripts/check-install-toolchain.mjs "$(npm --version)"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      - run: npm run verify:contracts
      - run: npm run verify:vectors
      # Code review P1-11: these are offline and were previously only run by
      # the dispatch release rehearsal, so packaging/supply-chain regressions
      # reached release day. Keep PR CI aligned with the `verify` contract.
      - run: npm run verify:buyer-skills
      - run: npm run verify:portfolio-products
      - run: npm run verify:supply-chain
      - run: npm run verify:audit-expiry
      - run: npm run verify:package
      # 审查 2026-11-10 P2-4：仓库存量 350+ TypeScript 文件未按 prettier 格式化，
      # 只对 PR 变更文件跑 --check 会让任何触碰旧文件的 PR 红灯且诱发无关大
      # diff；格式化治理需单独的全仓提交，门禁在此之前不启用。
