name: Supply-chain rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: lock
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const lock = JSON.parse(require('fs').readFileSync('portfolio.lock.json', 'utf8'));
          const hex40 = /^[0-9a-f]{40}$/;
          for (const [name, value] of Object.entries(lock.repositories)) {
            if (!hex40.test(value.commit)) {
              throw new Error(`${value.repository} commit is not a full 40-char SHA: ${value.commit}`);
            }
            console.log(`${name.replace('-', '_')}_sha=${value.commit}`);
          }
          if (!hex40.test(lock.contract_source_commit)) {
            throw new Error(`contract_source_commit is not a full 40-char SHA: ${lock.contract_source_commit}`);
          }
          NODE
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: harrylabsj/kiwi-catalog
          ref: ${{ steps.lock.outputs.kiwi_catalog_sha }}
          path: kiwi-catalog
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: harrylabsj/shopping-cli
          ref: ${{ steps.lock.outputs.shopping_cli_sha }}
          path: shopping-cli
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install "uv==0.10.6"
      - name: Generate dependency evidence
        run: |
          mkdir -p artifacts
          npm sbom --sbom-format=spdx > artifacts/kiwi.spdx.json
          (cd kiwi-catalog && uv export --locked --format requirements.txt) > artifacts/kiwi-catalog.requirements.txt
          (cd shopping-cli && uv export --locked --format requirements.txt) > artifacts/shopping-cli.requirements.txt
          sha256sum artifacts/* > artifacts/SHA256SUMS
          tar -czf portfolio-sbom.tgz artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portfolio-sbom
          path: portfolio-sbom.tgz
      - uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: portfolio-sbom.tgz
