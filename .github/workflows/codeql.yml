# CodeQL static analysis for the JavaScript/TypeScript Kiwi runtime.
#
# All third-party actions are pinned to full commit SHAs (no tag/branch refs,
# no network resolution at workflow runtime):
#   - actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
#   - github/codeql-action/{init,autobuild,analyze}@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
# The CodeQL action SHA has init/ and analyze/ action directories verified
# before pinning. No secrets are used.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
